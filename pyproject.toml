[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "republic-ner-matching"
version = "0.1.0"
description = "Match NER PER-layer spans from Republic resolutions to known delegates"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.4.0",
    "matplotlib>=3.10.9",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "rapidfuzz>=3.14.5",
    "requests>=2.34.2",
    "scikit-learn>=1.8.0",
    "tqdm>=4.66.0",
    "openpyxl>=3.1.2",
    "tomli-w>=1.0.0",
]

[project.optional-dependencies]
# Install with: uv pip install -e ".[flair]"
# GysBERT (emanjavacas/GysBERT) is downloaded from HuggingFace on first use.
# torch is intentionally unpinned here; install the CUDA variant manually if
# you have a GPU: uv pip install torch --index-url https://download.pytorch.org/whl/cu121
flair = [
    "flair>=0.15.0",
    "torch>=2.0",
    "transformers>=4.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
include = ["generate_alignment", "data_io", "tests"]
