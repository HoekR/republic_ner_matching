<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}P5 axis viewer{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">P5 axis successor</div>
    <div class="progress">
      showing {{ stats.showing }} / {{ stats.total }}
      · ledger {{ stats.ledger }} ({{ stats.accepted }} accepted · {{ stats.rejected }} rejected)
      · corpus {{ stats.corpus }}
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
