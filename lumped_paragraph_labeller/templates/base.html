<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Lumped paragraph gold{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">Lumped paragraph gold</div>
    <div class="progress" id="progress">{{ stats.labelled }} / {{ stats.total }} labelled</div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
