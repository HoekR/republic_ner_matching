[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PROJECT_NAME"
version = "0.1.0"
description = "DH pipeline with manifest-based data paths and LLM archivist"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0",
    "pyarrow>=24.0",
    "tomli-w>=1.0",
    "openpyxl>=3.1.2",
    "requests>=2.34.2",
]

[project.scripts]
archive-scan = "llm_archivist.cli:main"
archive-inventory = "llm_archivist.cli:inventory_main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["data_io", "llm_archivist", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]
