[datasets.gap_topology_diagnostic]
tier = "hot"
path = "republic_ner_matching/output/gap_topology_diagnostic.jsonl"
phase = "semi"
description = "Character-axis topology of the unresolved gaps between consolidated Group-A anchors: per gap, the unplaced resolution count K, the room in paragraphs, the characters actually available, and elasticity eps = L_char/(K*mu_len), tension tau = ln(eps)^2 and surprise z = (L_char - K*mu_len)/(sqrt(K)*sd_len). mu_len and sd_len are MEASURED at runtime and recorded in the run header row, never assumed -- the pooled estimate (total axis chars / total enriched resolutions) is the one consistent with a partition; the separated-placement mean runs higher because that subset is length-biased. z is the ranking statistic, not eps or tau: dispersion is CV_1 ~ 0.95, so a modest deviation is only trustworthy from K >= 11 (7.8% of gaps on the gold scope) while an extreme ratio stays informative at any K. A SCREEN, NOT A DIAGNOSIS: compression (many resolutions, few characters) and dilatation (far more text than the count implies) both have several possible causes, which the entity channel has to separate. Char offsets measure lengths only and are never used to score boundary precision, keeping the tolerance-metric family excluded. Diagnostic only: no placement, status or anchor-acceptance change."
