description = "14 human page reads (annotator rik, 2026-10-08) lifted out of the ground_truth_date_sample workbook into durable jsonl, because an open Excel session had already overwritten a regenerated copy of that workbook. Companion to manuscript_date_verdicts rather than an extension: those 7 were selected BECAUSE the automated channel could not settle them (over-representing hard cases), these 14 were selected to discriminate H-drift from H-attribution. Per row: the transcription as written, every date actually written on the page, whether the recorded label and the HTR-read heading each appear there, nihil-actum and postprandium flags, and a verdict. Headline: the HTR heading date is written on the page in 13 of 14 (the miss is 3185-num-112, where HTR read 16 June for a page reading 6 June -- a stroke added, the documented failure mode), while the recorded label appears on the page in only 5 of 14. Those 5 are the small-offset cases where the scan carries BOTH dates (typically a Sunday nihil actum then Monday's sitting; 3185-num-10 carries three: 11, 12 and 13 Jan), so the label is a collapsed day boundary rather than a wrong date. In the 8 large-offset cases (-11 to -40 days) the label is nowhere on the page. Transcription conventions: the `en` suffix is split off the numeral because it is uppercase on the page, the abbreviation period under the numeral is omitted as easily missed and uninformative, several dates in one cell are newline-separated, and roman numerals use terminal `ii` not REPUBLIC's `ij`. CAVEAT: n=14, deliberately weighted to large offsets and structurally odd sessions; no corpus rate may be derived from it."
