description = "Baseline vs. PER-RESOLUTION TF-IDF similarity as S6c `rank_scores` (segment_gap slot `rank` scored by enriched resolution `left_anchor + rank`'s own similarity row), swept over bonus scales and the raw / rownorm / zscore bonus forms, over the WHOLE corpus rather than the gold subset. Follows the collapsed per-paragraph-max wiring measuring NEGATIVE (s6c_similarity_position_scores_eval, commit 8f90e4b): that form varies with the absolute similarity level (mean 0.1314) rather than the correct-vs-best-wrong margin (0.0201), and cannot express which resolution belongs where. Scored ONLY on separated_count / separated_share (PLAN.md acceptance criteria, docs/METRICS.md Tier O) with NO gold dependency -- separation is a property of a prediction alone -- plus a weak_separation-day facet, a `weak_separation_gated` score (the condition applied on weak_separation days only, exact rather than estimated because separation is defined within one date), and a days_with_moved_starts count separating 'no effect' from 'bonus never cleared the dispersion penalty'. Carries no boundary-F1-at-tolerance figures (docs/METRICS.md:187). Counts are recomputed inside the run and are not directly comparable to the published 8,015 / 68.8%. Headline result (2026-09-29, 1,121 scoreable days, 14,472 attributed): NEGATIVE applied everywhere (best -25 at zscore/scale 3) but POSITIVE gated to weak_separation days (+315, 8,315 -> 8,630), i.e. the signal helps exactly where placement was already ambiguous and hurts where it was not. `separated` is coverage, not correctness -- the gated gain still needs correctness scoring."
