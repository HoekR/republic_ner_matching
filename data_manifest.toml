description = "Strategic page-read sample (scripts/build_ground_truth_date_sample.py) for human transcription, extending manuscript_date_verdicts -- the only true arbiter of the dating question (user, 2026-10-07: \"that is what i meant with more ground truth\"). Page reads are expensive, so rows are chosen to DISCRIMINATE between the two live hypotheses rather than to be representative: H-drift (the recorded label is wrong, the heading is right -- what the quarter-by-quarter page-offset measurement and the 80.9% heading-disagreement rate were read as supporting) versus H-attribution (the label is right and the date region attributed to the session is not that session own heading, via ES region->session attribution or a scan<->session offset -- raised when the content channel, profiled non-circularly over a date window, backed the label in 6 of 6 sampled disagreeing sessions and the heading in 0 of 6, and the session-index check showed a disagreeing session heading usually matches the label of an EARLIER session in the same volume by a volume-specific offset: 3186 -10/-11, 3188 -5, 3189 -3/-4/-5). Case classes: A the already-partly-read worked example 3185-num-103; B large offsets in the severe volumes 3185/3186; C headings naming a date no session claims; D the +/-1-day class (111 of 567, which content cannot resolve by construction); E a control in the clean volume 3187 where label and heading already agree, so a miss there invalidates the instrument; F the user own rule that a 2nd attendance list on a non-postprandium day implies a next-day sitting, sampled where the 2nd heading is NOT readable (i.e. where the rule matters -- it validated at only 25% where one IS readable); G a nihil-pinned Sunday from the 2026-10-07 nihil audit. Each row carries the label date, the heading date and what HTR read, the content-profile best date and rate (distinctive-proper-name match over +/-12 days, fuzzy >=85, never consulting the label), my inference, the hypothesis tested and what each hypothesis predicts, plus IIIF scan links and four blank columns for transcription. Explore phase: written for a human to fill in, never read by the pipeline."
