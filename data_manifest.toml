[datasets.session_offset_eval]
tier = "hot"
path = "republic_ner_matching/output/session_offset_eval.jsonl"
phase = "semi"
description = "Step 6 gate of plans/COLLISION_AVOIDANCE_TRACK.md: the enriched<->HTR session offset distribution, measured across the two streams rather than argued by analogy from s6b_session_fingerprint_match's flat<->raw offsets (which are HTR-side on both sides). Per inventory, enriched sittings are ranked by date with nihil_actum dates excluded (the hard skip constraint: a nihil sitting consumes no HTR session) and paragraph_axis_1626_1630 flat sessions by flat_num; sittings the concordance resolves are pins, and each bracket between consecutive pins is classified by unresolved sittings (n_e) vs unclaimed sessions (n_h). A determined bracket (n_e == n_h) forces a pairing by monotonicity alone, and the calendar-day distance of those forced pairs is the gate -- a pair beyond one day is a correspondence the ledger's +/-1-day candidate window provably could not reach. Also records the ordinal offset per resolved sitting (context only: it conflates label drift with genuinely absent HTR because the sequences differ in length) and checks Step 6's no-insertion claim at session level via unclaimed sessions in brackets with no sitting available. Diagnostic only, no placement change, no tolerance-family metric."
parent = "resolution_concordance_1626_1630"

