[datasets.h_session_date_vs_heading]
tier = "hot"
path = "republic_ner_matching/output/h_session_date_vs_heading.jsonl"
phase = "semi"
description = "Non-circular check (scripts/h_session_date_vs_heading.py) of each session's opening date heading against its recorded date. Supersedes an earlier version that compared the heading's date directly to our recorded date and reported our_date_wrong=610/1140 -- CIRCULAR and must not be cited: sampled 6 of 6, the heading's date equals ES's own uncorrected metadata.session_date, because ES segmented sessions using those headings in the first place, so heading-vs-recorded just restated ES-vs-ours. The fix: require the heading to be internally consistent first -- its stated weekday matches its own stated day numeral under the Gregorian calendar (pd.Period, never pd.to_datetime, pre-1678) -- a property of the manuscript text alone, independent of ES. Only a heading that passes this check is then compared to the recorded date, and even then as a source conflict, not a correctness verdict: paragraph_axis_1626_1630's recorded date is produced by this corpus's own REPUBLIC-derived heuristics, while the enriched edition's source XML is normative for the calendar sequence (every day recorded, non-session days as nihil actum), so where they disagree the recorded date is the heuristic, suspect side -- not proven wrong here. Measured (2026-10-07, CITABLE -- the standing 'do not cite' warning is lifted, see below): 1,314 sessions carry both a date region and a recorded date; agrees 165, disagrees 700, heading_inconsistent 11, unreadable 438; of the 865 decidable (agrees+disagrees), disagrees is 80.9% -- SUPERSEDED 2026-10-08 by the corpus scope bar (user: the enriched edition ends 1630-05-14, do not take later scans or HTR text into account): 184 post-bar sessions sat in that denominator, and in scope the figures are 1,130 readable headings, 744 decidable, 77.8% disagree. Use scripts/corpus_scope.py; the script now drops post-bar sessions at population selection and records sessions_excluded_past_scope_bar. Third fabrication bug fixed 2026-10-07 (the one that held the earlier counts uncitable): a year token parsed outside its volume's nominal year (3185=1626 ... 3189=1630) was accepted as data, turning OCR digit noise into decade-scale offsets -- the regression case `Mercuri den xiijen. Martij. 1636.` on a session recorded 1630-03-13 now scores `agrees` instead of a 2,190-day offset. Such a year is replaced with the volume's NOMINAL year, never with the recorded date's year (that substitution is bug #1 above and stays rejected), because the nominal year is a structural fact about which physical volume the page sits in, independent of the label under test; weekday/day/month are still checked against it, so a wholly wrong heading still yields heading_inconsistent. The fix moved 9 sessions (3 to agrees, 6 still disagreeing), so it was NOT the source of the large offsets -- those are real. Five residual year-scale offsets are named and set aside rather than absorbed: 3188-num-234/235 (a consecutive, mutually weekday-consistent 1630 run at the tail of a 1629 volume), 3189-num-154 (a 1631 heading), and 4562-num-251/253 (the order-breaking secret series). Shift demand sized per volume over the T/E ledger population (status_code T/E pass straight through to resolved_auto): 1,109 rows, 731 decidable, 567 disagreeing (77.6%), 500 of them negative (heading earlier than the label) and 261 beyond +/-7 days, i.e. provably unreachable by the ledger's +/-1-day candidate window. Per inventory: 3185 93.2% (median 12d, 90 beyond a week), 3186 97.7% (median 16d, 140), 3187 24.7% (median 2d, 1), 3188 99.4% (median 4d, 29, and the only volume with substantial positive offsets, 66 of 178), 3189 50.8% (median 2d, 0), 4562 7 decidable of 93. That profile independently reproduces the quarter-by-quarter page-offset measurement (plans/SEQUENCE_ALIGNMENT_TRACK.md 2026-10-06) from a different population by a different route -- 1628 near-clean, 1626-27 severe. That rate is conditional on LEGIBILITY (the 438 unreadable + 14 inconsistent are excluded, and nothing shows they behave like the rest) but NOT conditional on outcome, unlike the old 610 figure, which is what makes it usable. Two fabrication bugs fixed: a year accepted only if it already equaled ours else silently forced to ours, and a month substituted from our date when unparseable -- both now yield `unreadable` instead of a manufactured date. `qui heri`/`praesentibus qui` ('attendance formula', 41 rows) is a boolean flag only, not a verdict: a +1-day 'names yesterday' shift was proposed then withdrawn (inventory 3188 scans 0619-0621, a 4-session run only reads as consecutive under no-shift) then left UNSETTLED on the editor's own caution that it may still hold elsewhere; all verdicts here use the no-shift default. Where numeral and weekday disagree, weekday wins within a symmetric +/-2-day window (--max-numeral-slip) because HTR got the weekday right in every verified case of a dropped or added stroke (session-3185-num-72, session-3186-num-148); a one-day disagreement is the weakest point for this rule, since the clerk's own slip reads the identical text the other way (session-3185-num-72 scan 0123, second phrase). Internal consistency is strong evidence a heading names the day it claims, never proof. Diagnostic only, no placement change."
parent = "session_region_text_1626_1630"

[datasets.scans_per_day_by_ke]
tier = "hot"
path = "republic_ner_matching/output/scans_per_day_by_ke.jsonl"
phase = "semi"
description = "Exclusive scans per sitting day against k_e (scripts/measure_scans_per_day.py), the measurement plans/SCAN_SEQUENCE_TRACK.md step 1 left as an assumption: bootstrap_scan_anchors charges one scan to every day that is not nihil with k_e >= 3, a threshold set from the SHARING measurement (which days share a scan -- a fact about nihil days) and never from any measurement of whether a busy day fills a sheet, which left the headline forced count soft in a known direction. A day's exclusive extent is first_scan(next date) - first_scan(this date), the forward-claim rule from the implicit-end principle (nothing ever explicitly ends; every start claims forward to the next start), and it is a clean observation only for CALENDAR-ADJACENT pairs (next == this + 1 day), since otherwise an unread day in between absorbs part of the room; non-adjacent pairs are carried as a diluted per-day average and never mixed into the headline. Two things are kept that build_scan_anchor_brackets discards and must be kept here: every (scan, date) observation rather than setdefault-collapsing a scan to its first date, and room == 0 brackets -- those ARE the zero-scan days, so dropping them would guarantee the answer 'every day gets at least one scan' by construction. Anchors come from each date region's own text keyed by scan_id, never consulting session attribution; the heading's stated weekday must match its own numeral. Inventory 4562 excluded from the headline by the same rule bootstrap_scan_anchors uses (8 anchors 700 days apart on adjacent scans). Carries the per-k_e-bucket distribution of exclusive scans (P(0)/P(1)/P(>=2), mean, median) for sitting days and separately for nihil days as an instrument check, plus the threshold curve P(>=1 scan | k_e >= t) for t in 1..10 that the rule's threshold should be read off. KNOWN BIAS, stated in the dataset itself: the population is days whose own heading AND whose next day's heading both parsed strictly, so it is conditioned on two consecutive legible headings, not a random sample of sitting days -- the coverage block carries the k_e profile against all sitting days. MEASURED 2026-10-08 over 225 sitting days (median k_e 13 against 13 corpus-wide, so representative on k_e): the premise the assumption was doubted on is CONFIRMED -- P(>=1 scan | not nihil, k_e >= 3) = 0.950 -- but the arithmetic fails, P(exactly 1) = 0.362 with mean 1.89 scans per day and the step at k_e ~ 10 rather than 3 (under ten resolutions one scan, over ten two), corroborated independently at 1.84 by the 287 in-span non-adjacent pairs. Charging measured extents instead of a flat 1, room < charge rises from 13 brackets to 155 of 593 IN-SPAN brackets (26%); brackets wholly past the edition's last date are excluded from every denominator here (97 of 691 strict, 145 of 1,067 with bootstrap) because every day in them is charged 0 for want of a k_e and they can never be forced or contradictory. The flat-rule column reproduces bootstrap_scan_anchors' 139/2,079/13 and 284/4,281/27 to the digit, so the comparison is like for like, and it exposes a bookkeeping defect independent of any measurement: a bracket's day list opens at its own LEFT ANCHOR day, whose scan is observed rather than deduced, so (in scope) 3,161 of the 4,138 forced resolutions were never unplaced (228 of 277 forced brackets charge nothing but that anchor day) leaving 977 newly positioned, of which ~493 survive the exactly-one-scan requirement -- a real forced figure of 2.6% of 19,278, not 22%. Pre-scope-bar these read 3,261 / 4,281 / 234 / 284 / 1,020 / ~496. The edition's last date (1630-05-14) is read from the data and carried in the meta, because a missing k_e has two causes that must not be conflated: a day the edition skipped, and a day the edition never reached. Inventory 3189 runs to 1630-12-31, so 47 adjacent anchored days (92 with bootstrap) sit past the edition's end -- OUT OF SCOPE, not unaccounted room, a boundary running_axis already records. An earlier version of this description and of plans/SCAN_SEQUENCE_TRACK.md reported them as 105 scans of room no k_e can account for; that is RETRACTED (2026-10-08, on user challenge). With the span filter applied, ZERO anchored days inside the edition's span are unrecorded by it: the unaccounted-room class at day level is empty, not small, and any in-span unrecorded day is printed individually by the script rather than aggregated. Diagnostic only, no placement change."
parent = "session_region_text_1626_1630"

[datasets.scan_anchor_bootstrap]
tier = "hot"
path = "republic_ner_matching/output/scan_anchor_bootstrap.jsonl"
phase = "semi"
description = "Step 1 of plans/SCAN_SEQUENCE_TRACK.md: scan->date anchors added by parsing loosely INSIDE a bracket (scripts/bootstrap_scan_anchors.py). The strict DATE_PHRASE parser fires on only 708 of 1,794 scans carrying a date region; the failures are overwhelmingly abbreviated continuation headings (14. Januarij., 19. Meij.) that name a day but no weekday and no year, because the sheet already established both. A loose parse is unsafe in open text (5t. Joris reads as day 5) but safe inside a bracket, because two dated anchors bound the possibilities -- so the acceptance rule is not 'can a day be parsed' but 'does the parse disambiguate to exactly ONE date strictly inside this bracket'. Zero or several matches is a decline. Self-limiting and compounding: new anchors narrow the brackets, shrinking the candidate sets. A day requires its own scan when it is not nihil and k_e >= 3, a threshold set by the MEASURED sharing rule (user, 2026-10-08: days share a scan only when one is nihil actum or should have been; 86% of 66 observed sharing scans fit, the sharing day sitting at k_e=1, the nihil entry itself) and NEVER tuned against the contradiction count, since slackening the requirement drives contradictions and forcing to zero together. Carries the per-pass gate metrics: anchors, monotonicity violations, median bracket width, forced brackets/days/resolutions, and hard contradictions."
parent = "session_region_text_1626_1630"

[datasets.scan_anchor_brackets]
tier = "hot"
path = "republic_ner_matching/output/scan_anchor_brackets.jsonl"
phase = "semi"
description = "Brackets between consecutive scan->date anchors on the PHYSICAL scan axis (scripts/build_scan_anchor_brackets.py, plans/SCAN_SEQUENCE_TRACK.md, opened 2026-10-08). Anchors are parsed from each date region's own text and keyed by scan_id, NEVER consulting session attribution -- the 2026-10-08 page reads showed that link is the broken one (the dates were never the problem, the coordinate was: scan_id is observed in the region metadata while session attribution is inferred). Rests on the structural principle that sessions and resolutions never explicitly end but end when the next begins (user, 2026-10-08), so an end is not missing data, every start claims forward, the bracket is the natural unit rather than an approximation, no scan between two anchors is ever unclaimed (the 2026-10-06 orphan-page error came from computing extents as max(page_ids) instead of forward-to-next-start, making ES metadata.page_ids COMPLETE information rather than partial), and a bracket cannot be compressed -- room < predicted means non-contiguous anchors, absent pages or a wrong anchor, never squeezed business. Each bracket compares physical room (to_scan - from_scan) against what the logical layer requires: the XML sitting-day calendar, which has no physical grounding of its own, supplies the days in between and their k_e. Span model refitted with sitting-days and k_e as separate predictors after an earlier single-predictor fit applied a per-BRACKET intercept per DAY and manufactured a spurious shortfall class. CORRECTED 2026-10-08 under the scope bar: the earlier reading 'a sitting DAY costs ~1.3 scans almost regardless of how much business it holds while a resolution adds ~0.04 (about 28 to a scan)' was an ARTEFACT of post-bar brackets, whose days carry no k_e at all and therefore loaded all the room onto the day term; in scope the fit is room ~ 0.16 + 0.872*sitting_days + 0.071*k_e, i.e. ~0.87 scans per sitting day and ~14 resolutions to a scan, so k_e matters about twice as much as the artefact said. Fitted on core brackets only so pathological ones cannot set the coefficients. The model NARROWS a bracket and never determines it (residual sd ~2 scans against a median bracket of 3), so it is a resolver inside a bracket, never a global detector. Per-row type: fits / more_room_than_business (unaccounted pages -- where to look for an unread heading) / less_room_than_business (dominated by 4562, whose 8 anchors span 700-day gaps on adjacent scans, so the chain is correctly rejected wholesale rather than by name)."
parent = "session_region_text_1626_1630"

[datasets.scan_gap_findings]
tier = "hot"
path = "republic_ner_matching/output/scan_gap_findings.jsonl"
phase = "semi"
description = "Step 3 of plans/SCAN_SEQUENCE_TRACK.md (scripts/type_scan_gap_findings.py): every bracket on the physical scan axis typed against an EMPIRICAL null, one row per bracket ordered along the axis plus per-inventory-per-quarter timeline rows, so the dataset reads as a status of the timeline rather than a bag of findings. Same review-worklist form as unplaced_date_review (whose iiif_url is imported, not reimplemented) over a disjoint population -- that one lists enriched dates with no HTR session, this one lists stretches of paper. Produces NO count of determined placements: Step 3 previously ended 'and it is the pigeonhole argument from the counting question', which imported a forcing frame that was mine and that nobody asked for, and that clause was struck 2026-10-08 with the forced metric (22% -> 2.6%). The null is the measurement itself rather than a tolerance: the published room < charge figure (155 of ~594 brackets) charges each day the MEDIAN of its k_e bucket, so a bracket a scan or two short is exactly what a median predicts; here each charged day instead draws 4,000 times from the empirical distribution of exclusive extents for its own bucket (scans_per_day_by_ke's day rows, same MIN_BUCKET_DAYS thinness guard as requirement_curve), giving p_low = P(sum <= room) for room improbably SMALL -> shortfall, and p_high = P(sum >= room) for room improbably LARGE -> surplus_room (where to look for a heading never read). Nothing is fitted and alpha 0.05 is the tail of that null, not a tuned threshold. The cheapest explanation was checked first and MEASURED AS A NO-OP: a nihil day is charged 0 scans, so a nihil undercount would make brackets look short for free, and the production status column does undercount (h_xml_nihil_vs_feast_calendar found 34 XML-literal nihil dates missing from it because s4_day_status_resolution.py's T/E ledger rows bypass the nihil check) -- but this track never read that column. calendar() runs is_nihil_actum over each date's own concatenated text and recovers all 161, the identical set, so the charge here was never affected and 0 of the 155 shortfalls are absorbed. Both charges are still computed per row (charge_production_nihil, charge_xml_nihil) as a standing guard: if they ever diverge, a nihil regression has reached this track. THREE evidence fields are carried per row and deliberately NOT used to assign a type, so that whether they explain findings stays a measurement instead of becoming the definition of one: loose_anchor_from/to (end recovered by the bracket bootstrap, 1.3% measured parse error), long_span (day span above the 99th percentile of all brackets) and unrecorded_interior_days (interior dates the edition records nothing for); the script prints the cross-tab against each with the fits base rate beside it. Inventory 4562 is the one up-front exception, typed anchor_suspect by the same rule the rest of the track uses rather than by name (8 anchors 700 days apart on adjacent scans, so its arithmetic means nothing). BOTH ANCHOR SETS ARE WRITTEN, keyed by anchor_set, because they disagree 3x on shortfalls and one view would hide that: strict (610 anchors, 600 brackets) gives 8 shortfall / 49 surplus with no loose parse anywhere in it, while strict+bootstrap (1,054 anchors, 952 brackets) gives 24 / 28 -- the bootstrap converts surpluses into shortfalls by splitting roomy brackets, as filling in a heading should. meta.runs[].parse_error_bound sizes how much of each run's finding count can be parse error rather than paper (2 brackets per bad anchor at the hold-out's 1.3%: 0% of the strict findings, up to 22% of the bootstrapped ones). meta.runs[].reproduction_check verifies the bracket construction against the figure already published for this track -- the strict run reproduces room < charge on 155 of 593 brackets excluding 4562, exactly. meta.surplus_confirmed_by_bootstrap tests whether surplus_room really means an unread heading, using Step 1's bootstrap as an independent instrument that ran before these types existed: 63% of strict surplus brackets later received an interior anchor against a 29% fits base rate (2.2x), which confirms the class -- but shortfall scores 62% on the same test, so the signal is 'abnormal bracket' and does NOT discriminate surplus from shortfall. MISSING PAGES IS NOT A TYPE HERE and no row claims one: scan numbering inside an inventory is contiguous, so a digitisation gap is not observable from this data -- a shortfall says the paper between two dated headings cannot hold the days the calendar puts there and leaves the cause to the image, which each row links. Diagnostic only, no placement change."
parent = "scan_anchor_bootstrap"

[datasets.sequence_reconciliation]
tier = "hot"
path = "republic_ner_matching/output/sequence_reconciliation.jsonl"
phase = "semi"
description = "Reconciliation of the PHYSICAL scan sequence with the LOGICAL date sequence (scripts/reconcile_sequences.py), answering the user's 2026-10-08 question 'have we now reconciled the session sequence (physical) with the logical resolutions sequence?' -- the answer before this script was no. Built only from links that are OBSERVED rather than inferred. The chain and its single break: scan->date is observed (a heading parsed from the region's own text, never consulting session attribution; 1,054 in-scope anchors, monotone, median bracket 2-3 scans), session->its scans is observed in region metadata via resolution_archival_provenance, session->HTR resolutions->paragraphs is a flat_id fact, and date->enriched resolutions is a fact; ONLY session->enriched date is inferred, and the 2026-10-08 page reads showed that is the broken link. So the physical side resolves to DAYS, not years: the user's observation that an inventory/year mapping with a 365-day gap is always available describes the floor, not the starting point. One row per HTR session carrying the date range implied physically (the anchor bracket its first observed scan falls in, under the forward-claim rule that nothing ever explicitly ends) against the date the pipeline infers for it, with verdicts reconciled (label inside the implied range) / contradicted (outside -- a misattribution candidate named individually, with its offset in days to the nearer edge) / no_observed_scan / no_anchors / unconstrained / no_label_to_check, each blocked class reported with its paragraph mass rather than silently dropped. DIRECTION OF EVIDENCE, stated in the meta and not only here: the physical range is evidence and the label is a hypothesis, so a contradiction is not scored as the physical side being wrong -- but neither is it proof the label is wrong, because a bracket is only as good as its two anchors and the bootstrap carries a measured 1.3% loose-parse error, so anchor_set is carried per row and --strict-only gives the clean population. Monotonicity is applied as the free error filter this coordinate has and the session layer never did. Diagnostic only: no placement change, and any eventual re-dating writes to a new reviewable dataset rather than in place."
parent = "resolution_archival_provenance"

[datasets.bracket_gap_census]
tier = "hot"
path = "republic_ner_matching/output/bracket_gap_census.jsonl"
phase = "semi"
description = "Census of every non-tight open bracket (scripts/bracket_gap_census.py), Deliverable 1 of the 2026-10-08 bracket-census plan. Reuses running_axis.chain.build_brackets rather than forking bracket classification, joins paragraph capacity from the axis's own SessionSpans, and adds demand vs capacity (unresolved_k_e against unclaimed_paragraphs -- k_e is edition-side only, HTR has no k_e, and paragraphs are the capacity unit because a paragraph is what a cut can address), the join-vs-split direction PER GAP, the paragraph coordinates (para_lo/para_hi) a proposal would have to use, and BOTH COORDINATES: the logical bracket's pin dates together with the observed scan range of its own unclaimed sessions, with the disagreement as a column (user ruling 2026-10-08 -- a census on the logical layer alone cannot see this, because there the inferred label defines the bracket). CARRIES A RETRACTION IN ITS OWN DOCSTRING: a per-DAY join/split decomposition was computed first and reported as work to be done (552 days surplus / 7,575 paragraphs to join, 390 deficit / 1,886 to split, 117 exact); the user asked how we know those are not out-of-place paragraphs, and they mostly are. Misattribution must compensate locally while a real capacity mismatch need not, and on the residual k_e - paragraphs over 1,594 in-scope dated days: net/gross = 0.007 (sum -99 against gross 15,051), lag-1 autocorrelation -0.1995 at z = -8.0 against a 400-draw shuffled null, sign-flip rate 0.444 vs 0.402 at z = +4.1, a 7-day window retaining only 27% of the gross residual, deficit days' neighbours at mean residual -14.24 against -0.06 for all days, and the HTR-bearing neighbours of the 535 no-HTR days at -11.51 with 68% in surplus versus -5.37 and 52% for HTR days not adjacent to one. So the per-day residual is dominated by material sitting on the wrong day and the operation it calls for is MOVE, not join or split -- the signature metrics_ke_kf_window_drift_diagnostic was built to detect, now measured corpus-wide instead of on flagged windows. Consequently this script emits NO per-day figure and compares capacity only where both sides are anchored, inside a bracket between confirmed pins, because paragraph->session is solid and k_e->date is solid while session->date is the broken link. What survives, being counts rather than attributions: K_e 19,120, K_f 11,396, paragraphs 19,235, so paragraphs/K_f = 1.688 and K_e/K_f = 1.678 -- an HTR resolution averages 1.69 paragraphs and an enriched resolution about one, so closing K_f -> K_e is mostly cutting HTR resolutions at paragraph boundaries that ALREADY EXIST rather than cutting paragraphs; how much genuine sub-paragraph work remains is unmeasured again, since the 1,886 was a per-day quantity and goes with the retraction. Anchor-inventory columns (n_resolution_start_anchors, n_ner_cooccurrence_anchors, anchored_enriched_share, largest_unanchored_gap) are deliberately ABSENT: the per-anchor known points are not persisted anywhere, s6b_known_point_ledger writes 16 aggregate records and rebuilds its chain in-process from three Excel overlap files plus recomputed IDF weights over ~1,594 days, so that is a re-run of the anchor pipeline and not a join, and it needs its own step that persists the chain once. Until then this census carries no anchor evidence and proposes no cuts: it sizes the work and names the shapes. Diagnostic only."
parent = "running_axis_snapshot"

[datasets.bracket_business_ledger]
tier = "hot"
path = "republic_ner_matching/output/bracket_business_ledger.jsonl"
phase = "semi"
description = "Both layers' business on one bracket (scripts/bracket_business_ledger.py): what the edition requires (sitting days, k_e) against what the paper carries (HTR sessions, k_f, paragraphs), the three gap rankings the user asked for 2026-10-08 (dates/sessions, resolutions cumulative, resolutions per date), and where a separation would have to be proposed expressed in paragraphs. First bracket measurement able to carry the HTR side: every earlier one compared physical room in SCANS against logical business, and a scan is a weak unit (~14 resolutions to a scan, span-model residual sd ~2 scans against a median bracket of 3); resolution_archival_provenance supplies the missing flat_id -> scan_ids join so the comparison becomes resolution-to-resolution. SESSIONS are assigned to brackets, not resolutions: only 9,145 of 12,811 axis resolutions carry a scan (71.4%), so counting resolutions-with-a-scan would deflate k_f unevenly between brackets, whereas a session is placed by the first scan any of its resolutions is observed on and then ALL its axis resolutions and paragraphs are counted -- sessions sit on contiguous paper, so the placement survives patchy per-resolution coverage. The misattribution check falls out for free and is the point: a bracket's date range is OBSERVED (two headings on the paper) while a session's date label is INFERRED, and the 2026-10-08 page reads showed that inference is the broken link, so a session whose axis label lies outside the date range of the bracket its own paper sits in is a localised, checkable misattribution candidate -- the first instrument here that can name them one by one. Per-row problem_class typology: A one session covering several sitting days (SESSION separation), B k_e > k_f (RESOLUTION separation, cuts inside paragraphs), C k_f > k_e (over-split or foreign paper), D paragraphs < k_e (pigeonhole-blocked, no paragraph-level cut can separate them at all), E edition records business the paper carries none of, F paper carries business the edition does not record, G balanced. Scope bar applied at ingest to both the anchors and the paragraph axis (which carries 2,284 post-bar paragraphs). Diagnostic only: no placement change and no cut applied; cut candidates are proposals carrying their own evidence, and pigeonhole-blocked brackets get none."
parent = "resolution_archival_provenance"

