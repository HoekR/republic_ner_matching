[datasets.tfidf_similarity_pair_discrimination_eval]
tier = "hot"
path = "republic_ner_matching/output/tfidf_similarity_pair_discrimination_eval.jsonl"
phase = "semi"
description = "Standalone diagnostic (no production wiring, does not change align_session's semantic_weight/use_embeddings defaults): does AlignmentEmbedder(backend='tfidf').compute_similarity_matrix -- the cheap TF-IDF backend of the content-comparison mechanism already wired into align_session but never run with use_embeddings=True (alignment_1626_1630.parquet's own semantic_similarity column is 0.0 on all 13,342 rows) -- separate correct enriched<->flat resolution pairings from wrong ones, unlike the entity-bag score (nw_matches_gt_rate 0.957 correct vs 0.962 false-positive, PLAN.md 'Hypothesis'). Positive pairs: a seeded stratified sample (by inventory) of alignment_1626_1630's tier1_anchor days (>=150 target days, ~150 days). Negative pairs: scripts/d1c_idf_band_order_eval.py's pooled-fixed-offset-derangement control, reused unchanged (deranged_indices/control_offsets), applied within each sampled day rather than corpus-wide so the negative is a same-day wrong pairing, not a different-date topic mismatch. One AlignmentEmbedder call per day (positive = diagonal, negative = derangement-indexed off-diagonal cells from the same fitted TF-IDF space). Reports mean/median similarity per group, a same-day top-1 accuracy, and a common-language effect size / AUC (P(random positive > random negative)) as the discrimination statistic comparable to nw_matches_gt_rate's framing. Diagnostic only."
parent = "alignment_1626_1630"

[datasets.d1c_idf_band_order_eval]
tier = "hot"
path = "republic_ner_matching/output/d1c_idf_band_order_eval.jsonl"
phase = "semi"
description = "Step 3's gate in plans/COLLISION_AVOIDANCE_TRACK.md (hypothesis 5: entity order informs for common entities too, not only rare ones): D1c's Kendall tau on entity-mention order in tier-1 pairs, stratified by IDF band. Re-run rather than read off output/diagnostics_summary.json because run_diagnostics' band test (avg_idf >= 2.0 against log((total_docs+1)/(freq+1))+1) puts every name in the high band -- that run reports tau_low_idf = 0.0 on n = 0 pairs, so the stratification has never measured anything. Here: all 5,730 tier-1 pairs (no sampling), vocabulary = the >=4-character names in the three overlap tables (exactly what production's calculate_idf_weights covers), bands = mention-weighted terciles of overlap-evidence frequency, and a band's tau uses only that band's mentions inside a pair so it cannot be carried by rare mentions in the same pair. Also measures the competing explanation (shared-mention scarcity at containment 0.295 rather than alphabet density). Thresholds fixed in the script docstring before the run. Diagnostic only, no placement change, no tolerance-family metric."
parent = "alignment_1626_1630"

