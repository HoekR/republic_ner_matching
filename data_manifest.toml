[datasets.postprandium_days]
tier = "hot"
path = "republic_ner_matching/output/postprandium_days.jsonl"
phase = "semi"
description = "The 109 days the enriched edition's XML records as having two sittings, the second <postprandium> (afternoon). Stgen.dtd makes postprandium a first-class element alternating with the attendance list, with the group repeatable, so several sittings per day are explicitly modelled; enriched_resolutions_1626_1630 keeps no sitting field and loses the boundary. Recovering it is DELIBERATELY NOT ATTEMPTED (user, 2026-10-06: difficult to retrieve, keep it as a recording in case of confusion) -- this dataset is that recording, to consult when a day looks structurally confused before reaching for a more elaborate explanation. Measured behaviour of the 109: only 3 carry more than one HTR axis session, 67 exactly one, 39 none (32 of those in no_session); and only 3 of the 73 dates with several axis sessions are postprandium days, so afternoon sittings are not that multiplicity's main source, which is the main reason not to chase them."
parent = "enriched_resolutions_xml_source"

[datasets.enriched_person_name_variants]
tier = "hot"
path = "republic_ner_matching/output/enriched_person_name_variants.jsonl"
phase = "semi"
description = "Person ids from the enriched edition's own XML with every surface form it writes them under (scripts/build_enriched_person_variants.py). Built 2026-10-08 on the user's note that \"the edition also uses his assigned id\": enriched_resolutions_1626_1630 carries persons/president_ids/deputy_ids as ID LISTS while the XML writes each mention as <persoon idnr=\"727016\">Languerack</persoon>, so the edition already disambiguates people and only the id->name mapping was missing. This is the project's standing rule (known entities get dictionary lookup over recorded variants, not NER) applied to the edition side. Why it matters concretely: a surface search of the edition for `Langerack` returns nothing for January 1627 although the resolution is right there, because that entry spells it `Languerack`; id 727016 appears as Langerack/Languerack/Langeracq/Langueracq/Langherack. 2,246 of 6,430 ids carry more than one surface form (De Bije/De Bye/De Bie; Huijgens/Huygens/Hugens/Huigens; Lochteren/Luchteren). Each row carries mentions, all surface_forms with counts, and name_variants. `kind` separates name-like forms (<=3 tokens, no role vocabulary -- MATCH ON THESE) from role descriptions (ambassadeur bij de koning van Frankrijk); both are kept, since role descriptions are archival content and dropping them would breach the no-discarding rule, but they are never a surname. Enables two channels that single-surface matching could not support: content profiling of a session against a date's person ids, and roster matching of an HTR attendance region against the edition's president_ids/deputy_ids, which cover 1,428 distinct dates."
parent = "enriched_resolutions_xml_source"

[datasets.enriched_resolutions_xml_source]
tier = "hot"
path = "republic_ner_matching/data.bak/resoluties_staten_generaal_1626-1630.zip"
phase = "frozen"
description = "The enriched edition's own XML source: 1,595 day files (one per calendar day of 1626-01-01..1630-05-14, so a complete calendar rather than a list of sittings) plus Stgen.dtd, authored 2001. Registered 2026-10-06 because it had no manifest entry at all although enriched_resolution_secret_flags was extracted from it -- that dataset's provenance records created_by_script as empty, so the path was unrecoverable from the repo. The DTD is the authority on day structure: `zittingsdag ((presentielijst|postprandium?), resolutie*, noot*)+` makes postprandium (the afternoon sitting) a first-class element alternating with the attendance list, and the trailing + lets the whole group repeat, so MULTIPLE SITTINGS PER DAY are explicitly modelled. 109 day files carry <postprandium>, every one of them with more than one sitting group. enriched_resolutions_1626_1630 keeps none of this -- its records are date/resolution_index/text/persons/places/secret/volgnr with no sitting field -- so the boundary is discarded in the flattening, against the standing rule not to drop archival metadata in transforms."
parent = ""

